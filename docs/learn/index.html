<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="How I learned the Model Context Protocol in three days: the questions I asked, in order, and the answers that made it click.">
<title>Learn MCP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: chapter list on the left, one markdown chapter on the right. The .md files in this folder are the source; this page only renders them. */
:root {
  --bg: #f4f6f8; --sheet: #ffffff; --fg: #161a22; --muted: #5d6573; --rule: #dde2e8;
  --accent: #1c55b8; --accent-bg: rgba(28,85,184,.08); --code-bg: #f1f3f6; --quote: #17734f; --quote-bg: rgba(23,115,79,.07);
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1218; --sheet: #151a22; --fg: #e4e8ee; --muted: #98a1b0; --rule: #273040;
  --accent: #8db5ff; --accent-bg: rgba(141,181,255,.1); --code-bg: #1c2230; --quote: #5fd3a2; --quote-bg: rgba(95,211,162,.08); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1218; --sheet: #151a22; --fg: #e4e8ee; --muted: #98a1b0; --rule: #273040;
  --accent: #8db5ff; --accent-bg: rgba(141,181,255,.1); --code-bg: #1c2230; --quote: #5fd3a2; --quote-bg: rgba(95,211,162,.08); color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.top { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 14px; border-bottom: 1px solid var(--rule) }
.brand { font: 600 18px var(--mono); color: var(--fg); text-decoration: none; letter-spacing: -.01em }
.brand span { color: var(--accent) }
.top nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.top nav a, .top nav button { font: 500 13px var(--sans); padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); color: var(--fg); text-decoration: none; cursor: pointer }
#menuBtn { display: none }

.layout { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; padding-block: 24px 64px }
aside ol { list-style: none; margin: 0; padding: 0; position: sticky; top: 16px; display: grid; gap: 2px }
aside a { display: grid; grid-template-columns: 26px 1fr; gap: 4px; padding: 7px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14.5px; line-height: 1.35 }
aside a .n { font: 500 12.5px var(--mono); color: var(--muted); padding-top: 1px }
aside a:hover { background: var(--accent-bg) }
aside a[aria-current="page"] { background: var(--accent-bg); color: var(--accent); font-weight: 600 }

main { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: clamp(20px, 4vw, 44px); min-width: 0 }
main > :first-child { margin-top: 0 }
main h1 { font: 600 clamp(26px, 4vw, 34px)/1.15 var(--sans); letter-spacing: -.015em; margin: 0 0 18px }
main h2 { font: 600 22px/1.25 var(--sans); margin: 40px 0 12px; padding-top: 8px; border-top: 1px solid var(--rule) }
main h3 { font: 600 17.5px/1.3 var(--sans); margin: 28px 0 8px }
main h2, main h3 { scroll-margin-top: 16px }
main p, main li { max-width: 76ch }
main code { font: 0.88em var(--mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere }
main pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.6 var(--mono) }
main pre code { background: none; padding: 0; font: inherit; overflow-wrap: normal }
main blockquote { margin: 18px 0; padding: 10px 16px; border-left: 3px solid var(--quote); background: var(--quote-bg); border-radius: 0 8px 8px 0 }
main blockquote p { margin: 6px 0 }
.tbl { overflow-x: auto; margin: 16px 0; border: 1px solid var(--rule); border-radius: 8px }
main table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.5 }
main th, main td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--rule) }
main th { font-weight: 600; background: var(--code-bg) }
main tr:last-child td { border-bottom: 0 }
main hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0 }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--rule); flex-wrap: wrap }
.pager a { text-decoration: none; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 8px; color: var(--fg); font-size: 14.5px; max-width: 100% }
.pager a small { display: block; color: var(--muted); font-size: 12px }
.pager a:hover { border-color: var(--accent) }
.status { color: var(--muted) }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 16px }
  #menuBtn { display: inline-block }
  aside { display: none }
  aside.open { display: block }
  aside ol { position: static }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">learn<span>.</span>mcp</a>
  <nav>
    <button id="menuBtn" type="button" aria-expanded="false" aria-controls="toc">Chapters</button>
    <a href="../">Master object</a>
    <a id="srcLink" href="https://github.com/Vbmavani/mcp/tree/main/docs/learn">Source</a>
    <button id="themeBtn" type="button" aria-label="Toggle light or dark theme">◐</button>
  </nav>
</header>
<div class="layout">
  <aside id="toc"><ol id="chapters"></ol></aside>
  <main id="doc" aria-live="polite"><p class="status">Loading…</p></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const CHAPTERS = [
  ["README", "", "Start here"],
  ["00-how-i-learned", "0", "How I learned it"],
  ["01-why-mcp", "1", "Why MCP exists"],
  ["02-who-does-what", "2", "Who does what"],
  ["03-messages", "3", "Messages: JSON-RPC and friends"],
  ["04-server-features", "4", "What a server offers"],
  ["05-transports", "5", "Transports, streams and subscriptions"],
  ["06-auth", "6", "Auth: OAuth, tokens and API keys"],
  ["07-security", "7", "Security"],
  ["08-hands-on-lab", "8", "Hands-on lab"],
  ["09-ecosystem-and-future", "9", "Ecosystem and the future"],
  ["10-question-log", "10", "Every question I asked"],
];
const REPO = "https://github.com/Vbmavani/mcp/blob/main/";
const doc = document.getElementById("doc");
const toc = document.getElementById("toc");

// GitHub-style heading slug, so links written for GitHub also work here.
function slug(text, seen) {
  let s = text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
  if (seen[s] !== undefined) { seen[s] += 1; s = `${s}-${seen[s]}`; } else seen[s] = 0;
  return s;
}

function currentPage() {
  const p = new URLSearchParams(location.search).get("p");
  return CHAPTERS.some(c => c[0] === p) ? p : "README";
}

function renderToc(page) {
  document.getElementById("chapters").innerHTML = CHAPTERS.map(([id, n, title]) =>
    `<li><a href="?p=${id}"${id === page ? ' aria-current="page"' : ""}><span class="n">${n}</span><span>${title}</span></a></li>`
  ).join("");
}

// Chapter links (foo.md#x) stay on this page; repo links (../../x) go to GitHub.
function fixLinks(root) {
  root.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^[a-z]+:/i.test(href) || href.startsWith("#")) {
      if (/^https?:/i.test(href) && !href.includes("vbmavani.github.io")) { a.target = "_blank"; a.rel = "noopener"; }
      return;
    }
    const m = href.match(/^([\w-]+)\.md(#.*)?$/);
    if (m) { a.href = `?p=${m[1]}${m[2] || ""}`; return; }
    if (href.startsWith("../../")) { a.href = REPO + href.slice(6); a.target = "_blank"; a.rel = "noopener"; }
  });
}

async function load() {
  const page = currentPage();
  renderToc(page);
  document.getElementById("srcLink").href = `${REPO}docs/learn/${page}.md`;
  try {
    const res = await fetch(`${page}.md`, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    doc.innerHTML = marked.parse(await res.text());
  } catch (e) {
    doc.innerHTML = `<p class="status">Couldn't load this chapter. <a href="${REPO}docs/learn/${page}.md">Read it on GitHub</a>.</p>`;
    return;
  }
  const seen = {};
  doc.querySelectorAll("h1, h2, h3").forEach(h => { h.id = slug(h.textContent, seen); });
  doc.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
  fixLinks(doc);

  const i = CHAPTERS.findIndex(c => c[0] === page);
  const prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  const pager = document.createElement("nav");
  pager.className = "pager";
  pager.innerHTML = (prev ? `<a href="?p=${prev[0]}"><small>← Previous</small>${prev[2]}</a>` : "<span></span>") +
                    (next ? `<a href="?p=${next[0]}"><small>Next →</small>${next[2]}</a>` : "");
  doc.appendChild(pager);

  const h1 = doc.querySelector("h1");
  document.title = h1 && page !== "README" ? `${h1.textContent.replace(/^\d+\.\s*/, "")} · Learn MCP` : "Learn MCP";
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  else window.scrollTo(0, 0);
}

document.getElementById("menuBtn").addEventListener("click", e => {
  const open = toc.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("learn-mcp-theme", root.dataset.theme); } catch {}
});
try { const t = localStorage.getItem("learn-mcp-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

load();
</script>
</body>
</html>
